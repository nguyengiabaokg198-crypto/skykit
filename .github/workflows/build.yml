# Build + smoke-test the mod for every push/PR, and attach jar to GitHub
# Releases when a tag `v*` is pushed.

name: build

on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  smoke-server:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: accept eula
        run: mkdir -p run && printf 'eula=true\n' > run/eula.txt
      - name: start server, verify boot, stop
        run: |
          set -o pipefail
          { sleep 240; echo "stop"; } | \
            ./gradlew runServer --console=plain > server-log.txt 2>&1 || true
          tail -40 server-log.txt
      - name: verify server started
        run: grep -E "Done \(" server-log.txt
      - name: upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log
          path: server-log.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: create github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "SkyKit $GITHUB_REF_NAME" \
            --notes "SkyKit - bo tien ich skyblock cho Minecraft 26.3 (Fabric): Bridge (cau tu dung 8 khoi), AutoReplant (tu trong lai), Blueprint (chup cong trinh 1 the gioi -> dung lai the gioi khac, cam dung block di lai gan la tu lap).
          Cai: Fabric Loader 0.19.5+, Fabric API 0.165.0+26.3, dat file skykit-*.jar vao thu muc mods.
          Dung: /skykit kit de lay 3 do. Cam item + tap phai khong khi = mo GUI huong dan." \
            build/libs/*.jar
